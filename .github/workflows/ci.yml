name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck, lint, unit & component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - name: Prisma schema is valid
        run: npm run db:validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  # Integration (Testcontainers) and E2E (Playwright-BDD) jobs are added in Slices 5-6.
